server:
  port: 8081

spring:
  application:
    name: medistock-pro-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库 DDL 见: MediStockPro_设计交付包/01_数据库设计_DDL.sql
    url: jdbc:mysql://localhost:3306/medistock_pro?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:by123456}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 既有库(已含全部表)首次启动自动基线于 V1, 不重复执行 V1__init.sql; 空库则从头执行
    baseline-on-migrate: true
    baseline-version: "1"
    validate-on-migrate: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization        # 请求头名称
  token-prefix: Bearer             # 前缀
  timeout: 86400                   # 会话有效期(秒)
  active-timeout: 3600             # 无操作过期
  is-concurrent: true              # 允许同账号多端
  is-log: false
  jwt-secret-key: ${JWT_SECRET_KEY:medistock-pro-jwt-secret-change-me-in-prod}

knife4j:
  enable: true
  setting:
    language: zh_cn

# 业务参数(对应 system_param 表默认值)
medistock:
  expiry-alert-days: 90            # 效期预警默认天数
  bill-no-prefix:
    inbound: RK
    issue: CK
    transfer: DB
    count: PD
    scrap: BF
    purchase: PO
