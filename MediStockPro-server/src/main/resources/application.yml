server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: medistock-pro-server
  # 默认开发环境; 生产启动通过 --spring.profiles.active=prod 或环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 既有库(已含全部表)首次启动自动基线于 V1, 不重复执行 V1__init.sql; 空库则从头执行
    baseline-on-migrate: true
    baseline-version: "1"
    validate-on-migrate: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization        # 请求头名称
  token-prefix: Bearer             # 前缀
  timeout: 86400                   # 会话有效期(秒)
  active-timeout: 3600             # 无操作过期
  is-concurrent: true              # 允许同账号多端
  is-log: false
  # jwt-secret-key 由各环境 profile 提供: dev 有内置默认值, prod 必须通过 JWT_SECRET_KEY 注入

# 接口文档默认关闭, 仅 dev 环境开启
knife4j:
  enable: false
  setting:
    language: zh_cn

# 业务参数(对应 system_param 表默认值)
medistock:
  expiry-alert-days: 90            # 效期预警默认天数
  bill-no-prefix:
    inbound: RK
    issue: CK
    transfer: DB
    count: PD
    scrap: BF
    purchase: PO
